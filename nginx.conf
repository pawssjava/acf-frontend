server {
      listen 80;
      root /usr/share/nginx/html;
      index index.html;

      server_tokens off;

      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
      add_header Referrer-Policy "no-referrer" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://api.cyberfootball.kz https://s3.cyberfootball.kz; font-src 'self'; connect-src 'self' https://api.cyberfootball.kz; frame-ancestors 'none'; object-src 'none'; base-uri 'self';" always;

      location / {
          try_files $uri $uri/ /index.html;
      }

      gzip on;
      gzip_types text/plain text/css application/json application/javascript;
}
